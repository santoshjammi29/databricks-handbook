name: "Setup Python & uv Environment"
description: "Installs uv, configures Python from .python-version, and syncs locked dependencies."

inputs:
  extras:
    description: "Space-separated uv sync extra flags (e.g. '--extra dev')"
    required: false
    default: "--extra dev"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: ".python-version"

    - name: Sync Locked Environment
      shell: bash
      run: uv sync --locked ${{ inputs.extras }}
