name: Nightly Spark Smoke Tier

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spark-smoke:
    name: Local Spark & Delta Lake Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install Java 17 for PySpark Runtime
        uses: actions/setup-java@8df10395026330e168a64f8e5caa057b322870e5 # v4.5.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Package with Spark Extra
        run: uv sync --extra spark --extra dev

      - name: Run Spark Smoke Tests
        run: uv run pytest -m spark -v
