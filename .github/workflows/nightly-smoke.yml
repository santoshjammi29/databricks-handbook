name: Nightly Spark Smoke Tier

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spark-smoke:
    name: Local Spark & Delta Lake Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@887d94cf343a4e69b5635f79a9ef1c9b369c0d3f # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fb717ef6b1d4a858d4d1dee3ac30aaf # v5.3.0
        with:
          python-version-file: ".python-version"

      - name: Install Java 17 for PySpark Runtime
        uses: actions/setup-java@8df10395026330e168a64f8e5caa057b322870e5 # v4.5.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Package with Spark Extra
        run: uv sync --extra spark --extra dev

      - name: Run Spark Smoke Tests
        run: uv run pytest -m spark -v
