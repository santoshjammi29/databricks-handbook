name: Security & Vulnerability Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@887d94cf343a4e69b5635f79a9ef1c9b369c0d3f # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fb717ef6b1d4a858d4d1dee3ac30aaf # v5.3.0
        with:
          python-version-file: ".python-version"

      - name: Install Dev Dependencies
        run: uv sync --extra dev

      - name: Run pip-audit
        run: uv run pip-audit

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@f2f64ddc0eb098528ce0a9f5c4ce126b8cb7fc9a # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Dependency Review
        uses: actions/dependency-review-action@5a5f3f03b2c286a1005b823e59008bc591c9447e # v4.5.0
