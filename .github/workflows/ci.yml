name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@887d94cf343a4e69b5635f79a9ef1c9b369c0d3f # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install Dev Tooling
        run: uv sync --extra dev

      - name: Run Ruff Linter
        run: uv run ruff check src tests apps

      - name: Run Ruff Format Check
        run: uv run ruff format --check src tests apps

  build-drift:
    name: Deterministic Build & Drift Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@887d94cf343a4e69b5635f79a9ef1c9b369c0d3f # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install Package
        run: uv sync --extra dev

      - name: Verify Generator vs Notebook Disk Drift
        run: uv run python -m handbook.cli build --check

  validate:
    name: Artifact & Bundle Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@887d94cf343a4e69b5635f79a9ef1c9b369c0d3f # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install Package
        run: uv sync --extra dev

      - name: Validate Databricks Notebooks Formatting & AST
        run: uv run python -m handbook.cli validate --target notebooks

      - name: Validate DAB Bundle Configuration & Resources
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "Running online Databricks bundle validate..."
            curl -fsSL https://raw.githubusercontent.com/databricks/cli/main/install.sh | sh
            databricks bundle validate -t dev
          else
            echo "Running offline bundle schema and resource path validation..."
            uv run python -m handbook.cli validate --target bundle
          fi

      - name: Validate Repository Hygiene & Architectural Invariants
        run: uv run python -m handbook.cli validate --target hygiene

  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@887d94cf343a4e69b5635f79a9ef1c9b369c0d3f # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install Package & Test Dependencies
        run: uv sync --extra dev

      - name: Run Test Suite with Coverage
        run: uv run pytest --cov=handbook tests/ -v

  links:
    name: Markdown Link & Anchor Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@887d94cf343a4e69b5635f79a9ef1c9b369c0d3f # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install Package
        run: uv sync --extra dev

      - name: Validate Internal Relative Links & Anchors
        run: uv run python -m handbook.cli validate --target links
