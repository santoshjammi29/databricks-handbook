name: Handbook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: santoshjammi29/.github/.github/workflows/handbook-ci.yml@v1
    with:
      # Official Databricks DAB bundle.schema.json is 1.33 MB.
      max_file_kb: 1500
