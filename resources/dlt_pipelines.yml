# Databricks Asset Bundle Resource: Delta Live Tables (DLT) Declarative Pipelines
# Specification: https://docs.databricks.com/dev-tools/bundles/settings.html#resources-pipelines

resources:
  pipelines:
    databricks_handbook_dlt_pipeline:
      name: "[${bundle.target}] Databricks Handbook Declarative DLT Pipeline"
      target: "${var.schema}"
      catalog: "${var.catalog}"
      continuous: false
      development: "${bundle.target == 'dev'}"
      channel: "current"
      edition: "ADVANCED"
      photon: true

      libraries:
        - notebook:
            path: "../notebooks/04_lakeflow_ingestion_and_dlt/036_delta_live_tables_dlt_foundations_streaming_tables_vs_materialized_views.py"
        - notebook:
            path: "../notebooks/04_lakeflow_ingestion_and_dlt/039_dlt_change_data_capture_incremental_upserts_apply_changes_scd1.py"

      configuration:
        "bundle.environment": "${bundle.target}"
        "pipelines.useDeltaLiveTables": "true"
        "spark.sql.streaming.forceDeleteTempCheckpointLocation": "true"

      clusters:
        - label: "default"
          node_type_id: "${var.node_type_id}"
          autoscale:
            min_workers: 1
            max_workers: 3
