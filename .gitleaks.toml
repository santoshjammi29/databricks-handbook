[extend]
# Extend default gitleaks configuration

[allowlist]
description = "Global allowlist for intentional fictitious placeholders and educational mock tokens"
regexes = [
    '''4f63c679-0db8-40a2-b91a-7b3b7e7136f4''',
    '''a1b2c3d4-e5f6-7890-abcd-ef1234567890''',
    '''99a8b7c6-1234-5678-abcd-ef0123456789''',
]
paths = [
    '''\.gitleaks\.toml$''',
    '''notebooks/.*''',
    '''src/handbook/curriculum\.py''',
    '''src/handbook/generators/.*''',
    '''tests/.*''',
]
