[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-handbook"
version = "1.0.0"
description = "The Databricks Handbook: 105 Production Databricks Data Intelligence Platform Recipes, Unity Catalog, Delta Lake 3.x, Lakeflow, Photon, DABs, and Incident Runbooks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Santosh Jammi" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "jsonschema>=4.23.0",
    "pyyaml>=6.0",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.6",
    "pre-commit>=4.7.0",
    "pip-audit>=2.10.1",
]
spark = [
    "pyspark>=3.5.0,<3.6.0",
    "delta-spark>=3.2.0,<3.3.0",
    "chispa>=0.9.4",
]
connect = [
    # MUTUALLY EXCLUSIVE WITH SPARK: Databricks Connect replaces pyspark.
    # Do NOT install both into the same virtualenv.
    "databricks-connect>=15.4.0,<15.5.0",
    "databricks-sdk>=0.28.0",
]
app = [
    "streamlit>=1.35.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
]
ml = [
    "mlflow>=2.15.0",
]

[project.scripts]
handbook = "handbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Notebooks and generators must remain byte-identical (and are excluded from format)
"notebooks/**" = ["ALL"]
"src/handbook/generators/**" = ["ALL"]
"src/handbook/notebooks/builder.py" = ["E501", "W291", "W293"]
"apps/**" = ["E501"]
"tests/**" = ["S101", "E501"]

[tool.ruff.format]
exclude = [
    "notebooks/**",
    "src/handbook/generators/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "spark: marks tests requiring local Apache Spark runtime and delta-spark",
    "slow: marks tests that are computationally expensive",
]

[tool.coverage.run]
source = ["src/handbook"]
omit = [
    "src/handbook/generators/*",
    "src/handbook/data/*",
    "src/handbook/notebooks/explorer.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 75
