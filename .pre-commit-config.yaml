# See https://pre-commit.com for more information
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^(assets/|src/handbook/data/bundle\.schema\.json$)
      - id: end-of-file-fixer
        exclude: ^(notebooks/|.*\.md$)
      - id: trailing-whitespace
        exclude: ^(notebooks/|.*\.md$)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(notebooks/|src/handbook/generators/)
      - id: ruff-format
        exclude: ^(notebooks/|src/handbook/generators/)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: handbook-validate-fast
        name: handbook validate --fast
        entry: uv run python -m handbook.cli validate --fast
        language: system
        pass_filenames: false
        always_run: true
