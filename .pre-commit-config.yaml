# See https://pre-commit.com for more information
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
exclude: ^(\.agents/|notebooks/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^(assets/|src/handbook/data/bundle\.schema\.json$)
      - id: end-of-file-fixer
        exclude: ^(src/handbook/generators/|src/handbook/notebooks/builder\.py$|manifest\.json$|assets/.*\.svg$|.*\.md$|src/handbook/data/bundle\.schema\.json$)
      - id: trailing-whitespace
        exclude: ^(src/handbook/generators/|src/handbook/notebooks/builder\.py$|manifest\.json$|.*\.md$|src/handbook/data/bundle\.schema\.json$)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        entry: gitleaks protect --verbose --redact --staged --config .gitleaks.toml
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (src tests apps)
        entry: uv run ruff check --fix --exit-non-zero-on-fix src tests apps
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format --check (src tests apps)
        entry: uv run ruff format --check src tests apps
        language: system
        pass_filenames: false
        types: [python]
      - id: handbook-validate-fast
        name: handbook validate --fast
        entry: uv run handbook validate --fast
        language: system
        pass_filenames: false
        always_run: true
